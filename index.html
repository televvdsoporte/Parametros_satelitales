<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parámetros Satelitales</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f4f6f9;
    color: #222;
}

h1 {
    text-align: center;
}

.contenedor {
    max-width: 1200px;
    margin: auto;
}

.filtros {
    display: flex;
    gap: 12px;
    margin: 25px 0;
    flex-wrap: wrap;
}

select, input {
    padding: 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

input {
    flex: 1;
    min-width: 220px;
}

select {
    min-width: 200px;
}

.programadora {
    background: white;
    padding: 18px;
    margin-bottom: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 5px #ddd;
}

h2 {
    color: #174b7a;
    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    overflow-x: auto;
}

th, td {
    padding: 12px;
    text-align: left;
    border: 1px solid #ddd;
    white-space: nowrap;
}

th {
    background: #174b7a;
    color: white;
}

tr:nth-child(even) {
    background: #f2f5f8;
}

.tabla-contenedor {
    overflow-x: auto;
}

#mensaje {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<div class="contenedor">

    <h1>Portal de Parámetros Satelitales</h1>

    <div class="filtros">

        <select id="pais">
            <option value="">Seleccionar país</option>
        </select>

        <input
            type="text"
            id="busqueda"
            placeholder="Buscar señal..."
            disabled
        >

    </div>

    <div id="resultados">
        <p id="mensaje">Selecciona un país para consultar las señales.</p>
    </div>

</div>

<script>

let parametros = [];

const selectorPais = document.getElementById("pais");
const busqueda = document.getElementById("busqueda");
const resultados = document.getElementById("resultados");
const mensaje = document.getElementById("mensaje");

// Cargar información desde parametros.json
fetch("parametros.json")
.then(respuesta => {
    if (!respuesta.ok) {
        throw new Error("No se pudo cargar el archivo de parámetros.");
    }
    return respuesta.json();
})
.then(datos => {

    parametros = datos;

    const paises = [...new Set(
        parametros.map(dato => dato.pais)
    )].sort();

    paises.forEach(pais => {

        const opcion = document.createElement("option");
        opcion.value = pais;
        opcion.textContent = pais;

        selectorPais.appendChild(opcion);

    });

})
.catch(error => {

    resultados.innerHTML =
        "<p>Error al cargar los parámetros. Verifica el archivo parametros.json.</p>";

    console.error(error);

});

// Seleccionar país
selectorPais.addEventListener("change", () => {

    busqueda.value = "";

    if (selectorPais.value === "") {
        busqueda.disabled = true;
        resultados.innerHTML =
            "<p id='mensaje'>Selecciona un país para consultar las señales.</p>";
        return;
    }

    busqueda.disabled = false;
    mostrarResultados();

});

// Buscar señal
busqueda.addEventListener("input", mostrarResultados);

// Mostrar señales agrupadas por programadora
function mostrarResultados() {

    const paisSeleccionado = selectorPais.value;
    const texto = busqueda.value.toLowerCase().trim();

    const filtrados = parametros.filter(dato => {

        return dato.pais === paisSeleccionado &&
            dato.senal.toLowerCase().includes(texto);

    });

    if (filtrados.length === 0) {

        resultados.innerHTML = "<p>No se encontraron señales.</p>";
        return;

    }

    const programadoras = [...new Set(
        filtrados.map(dato => dato.programadora)
    )].sort();

    let html = "";

    programadoras.forEach(programadora => {

        const senales = filtrados.filter(
            dato => dato.programadora === programadora
        );

        html += `
            <div class="programadora">

                <h2>${programadora}</h2>

                <div class="tabla-contenedor">
                <table>

                    <thead>
                        <tr>
                            <th>Señal</th>
                            <th>Satélite</th>
                            <th>Polaridad</th>
                            <th>Frecuencia</th>
                            <th>SR</th>
                            <th>Net ID</th>
                            <th>Modulación</th>
                            <th>Canal Virtual</th>
                        </tr>
                    </thead>

                    <tbody>
        `;

        senales.forEach(dato => {

            html += `
                <tr>
                    <td>${dato.senal}</td>
                    <td>${dato.satelite}</td>
                    <td>${dato.polaridad}</td>
                    <td>${dato.frecuencia}</td>
                    <td>${dato.sr}</td>
                    <td>${dato.net_id}</td>
                    <td>${dato.modulacion}</td>
                    <td>${dato.canal_virtual}</td>
                </tr>
            `;

        });

        html += `
                    </tbody>
                </table>
                </div>
            </div>
        `;

    });

    resultados.innerHTML = html;

}

</script>

</body>
</html>
