<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parámetros Satelitales</title>

<link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>

<div class="contenedor">

    <header>
        <h1>Parámetros Satelitales</h1>
        <p>Consulta de señales y configuraciones técnicas por país y programadora.</p>
    </header>

    <div class="busqueda">

        <select id="pais">
            <option value="">Seleccionar país</option>
        </select>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar señal..."
            disabled
        >

    </div>

    <div id="resultados">
        <div class="mensaje">
            Selecciona un país para consultar las señales disponibles.
        </div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
