<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parámetros Satelitales</title>

<link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>

<div class="contenedor">

<header class="encabezado">
    <div class="encabezado-contenido">

        <div class="encabezado-texto">
            <span class="encabezado-etiqueta">
                PLATAFORMA TÉCNICA
            </span>

            <h1>Parámetros Satelitales</h1>

            <p>
                Consulta de señales y configuraciones técnicas
                por país y programadora.
            </p>
        </div>

        <div class="encabezado-logo">
            <img
                src="logo%20Tele%20vvd.png"
                alt="TeleVVD"
            >
        </div>

    </div>
</header>
    
        <!-- INDICADORES DEL SISTEMA -->
    <section class="indicadores">

        <div class="tarjeta-indicador">
            <div class="indicador-icono">🌎</div>
            <div>
                <span class="indicador-titulo">PAÍS SELECCIONADO</span>
                <h2 id="indicador-pais">—</h2>
            </div>
        </div>

        <div class="tarjeta-indicador">
            <div class="indicador-icono">📡</div>
            <div>
                <span class="indicador-titulo">SEÑALES DISPONIBLES</span>
                <h2 id="indicador-senales">0</h2>
            </div>
        </div>

        <div class="tarjeta-indicador">
            <div class="indicador-icono">📺</div>
            <div>
                <span class="indicador-titulo">PROGRAMADORAS</span>
                <h2 id="indicador-programadoras">0</h2>
            </div>
        </div>

    </section>
    
    <div class="busqueda">

        <select id="pais">
            <option value="">Seleccionar país</option>
        </select>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar señal..."
            disabled
        >

    </div>

    <div id="resultados">
        <div class="mensaje">
            Selecciona un país para consultar las señales disponibles.
        </div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
